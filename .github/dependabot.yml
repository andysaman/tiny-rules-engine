version: 2
updates:
  # Security update pull requests stay enabled. This limit turns off routine
  # version-update pull requests; those use a separate quota from security updates.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
